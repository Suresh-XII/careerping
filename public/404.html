<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Careerping - Redirecting...</title>
    <script type="text/javascript">
      // GitHub Pages SPA redirect: preserves paths like /resillion-soc-analyst or /careerping/resillion-soc-analyst
      var pathSegmentsToKeep = 0;
      // If deployed under subfolder e.g. /careerping/, set pathSegmentsToKeep to 1 if pathname starts with /careerping
      var path = window.location.pathname;
      if (path.indexOf('/careerping') === 0) {
        pathSegmentsToKeep = 1;
      }
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <p>Redirecting to Careerping...</p>
  </body>
</html>
